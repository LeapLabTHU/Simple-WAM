# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: simplewam
  - _self_

# dataloading
global_batch_size: 128
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 5000
save_state_every: 100000
eval_every: 200

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null

data:
    train:
      use_precomputed_video_latents: true
      video_latent_cache_dir: ./data/video_latents/libero

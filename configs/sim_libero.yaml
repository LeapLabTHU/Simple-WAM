# @package _global_

defaults:
  - train
  - override /task: libero_joint_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  freeze_future_video_noise: false
  profile_action_chunk_time: false
  action_chunk_timing_scope: end_to_end  # end_to_end or main_model
  compile_action_infer: false
  torch_compile_action: false
  torch_compile_video: false
  torch_compile_backend: inductor
  torch_compile_mode: reduce-overhead
  torch_compile_fullgraph: false
  torch_compile_dynamic: false
  torch_compile_cudagraph_trees: false
  save_attention_maps: false
  attention_max_replans: 1
  attention_max_denoise_steps: 0
  attention_grid_step_indices: [0, 5, 9]
  attention_grid_layer_indices: [0, 15, 29]
  attention_grid_tile_h: 56
  attention_grid_tile_w: 112

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  offload_text_encoder: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  overrides_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2
  persistent_workers: false

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
